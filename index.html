<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Agu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090503}
body{font-family:Georgia,"Times New Roman",serif}
body:before{content:"";position:fixed;inset:-30px;background:url("cake-scene.png") center/cover no-repeat;filter:blur(24px) brightness(.42);transform:scale(1.08);z-index:-1}
.stage{position:fixed;left:50%;top:50%;width:max(100vw,calc(100vh * 1.806));height:max(100vh,calc(100vw / 1.806));transform:translate(-50%,-50%);overflow:hidden;background:#090503}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:brightness(.92);transition:filter 1s ease}
.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,175,75,.10),rgba(0,0,0,.10) 72%)}

/* candle glow */
.glow{position:absolute;width:35vw;max-width:560px;aspect-ratio:1;border-radius:50%;pointer-events:none;mix-blend-mode:screen;filter:blur(16px);background:radial-gradient(circle,rgba(255,231,160,.32),rgba(255,144,39,.16) 30%,rgba(255,90,20,.045) 52%,transparent 72%);transition:opacity .8s ease}
.g2{left:24%;top:0}.g1{left:43%;top:0}

/* transparent interactive zones aligned with photographed candles */
.candle{position:absolute;z-index:8;border:0;background:transparent;padding:0;cursor:pointer;transform-origin:50% 85%;transition:transform .18s ease}
.c2{left:37.6%;top:22.3%;width:10.8%;height:24.5%}
.c1{left:53.0%;top:22.3%;width:8.6%;height:24.5%}
.candle:hover{transform:translateY(-6px) rotate(-1deg)}

/* larger CSS flame aligned to wick */
.flame{position:absolute;left:50%;top:-32%;width:30%;height:41%;min-width:24px;min-height:62px;max-width:42px;max-height:92px;transform:translateX(-50%);transform-origin:50% 100%;border-radius:50% 50% 43% 57%/69% 69% 31% 31%;background:radial-gradient(ellipse at 50% 73%,#fff 0 13%,#fffbd0 14% 27%,#ffe26a 31%,#ffb126 47%,#ff7c17 64%,#f24a08 77%,rgba(255,70,0,.02) 89%);box-shadow:0 0 9px rgba(255,255,215,.95),0 0 22px rgba(255,181,53,.92),0 0 46px rgba(255,111,20,.72);animation:flicker .24s infinite alternate ease-in-out}
.flame:after{content:"";position:absolute;left:39%;bottom:0;width:23%;height:27%;border-radius:50%;background:#6384ff;filter:blur(1px)}
@keyframes flicker{0%{transform:translateX(-50%) rotate(-3deg) scale(.93,1.07)}50%{transform:translateX(-50%) rotate(1deg) scale(1.04,.96)}100%{transform:translateX(-50%) rotate(3deg) scale(.96,1.09)}}
.candle:hover .flame{animation-duration:.16s}
.candle.out .flame{animation:die .55s ease-out forwards}
@keyframes die{0%{opacity:1;transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) rotate(25deg) scale(.72,.48)}75%{opacity:.45;transform:translateX(-50%) rotate(32deg) scale(.4,.2)}100%{opacity:0;transform:translateX(-50%) rotate(34deg) scale(.02)}}
.smoke{position:absolute;left:50%;top:-9%;width:10px;height:10px;border-radius:50%;background:rgba(220,216,208,.58);filter:blur(4px);opacity:0}
.candle.out .smoke{animation:smoke 2s .25s ease-out forwards}
@keyframes smoke{0%{opacity:.45;transform:translate(-50%,0) scale(.5)}50%{opacity:.25;transform:translate(-100%,-42px) scale(2)}100%{opacity:0;transform:translate(25%,-105px) scale(4)}}

/* celebration */
.celebration-shade{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.58) 0%,rgba(0,0,0,.43) 24%,rgba(0,0,0,.18) 48%,transparent 72%);transition:opacity 1.8s ease}.celebration-shade.show{opacity:1}.message{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.9);filter:blur(8px);transition:opacity 1.8s ease,transform 1.8s ease,filter 1.8s ease}
.message.show{opacity:1;transform:scale(1);filter:blur(0)}
.message.fade{opacity:0;transform:scale(1.035);filter:blur(5px)}
.message-card{text-align:center;width:min(90vw,1000px);padding:24px}
.birthday-title{color:#ffe8ad;font-size:clamp(48px,7vw,108px);line-height:.98;text-shadow:0 0 14px #ffb54a,0 0 44px rgba(255,133,25,.52),0 6px 22px #000}
.personal-message{margin:28px auto 0;color:#fff3d2;font-family:Georgia,"Times New Roman",serif;font-size:clamp(18px,2vw,31px);line-height:1.45;text-shadow:0 3px 12px #000;max-width:900px}
.hug-note{display:inline-block;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,226,158,.75);color:#f7dfaa;font-size:clamp(14px,1.35vw,21px);letter-spacing:.03em;text-shadow:0 2px 10px #000}

/* relight over exactly 3 seconds */
.candle.relighting .flame{animation:relight 3s ease-in-out forwards}
@keyframes relight{
  0%{opacity:0;transform:translateX(-50%) scale(.02)}
  35%{opacity:.18;transform:translateX(-50%) scale(.25,.18)}
  70%{opacity:.65;transform:translateX(-50%) scale(.72,.78)}
  100%{opacity:1;transform:translateX(-50%) scale(1)}
}
.glow.relighting{transition:opacity 3s ease!important;opacity:1!important}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}


@media (max-width:700px) and (orientation:portrait){
  .stage{
    width:122vw;
    height:67.53vw;
    max-width:none;
    max-height:none;
    top:46%;
  }
  body:before{
    background-position:center;
    filter:blur(22px) brightness(.30);
    transform:scale(1.16);
  }
  .message-card{width:96vw;padding:12px}
  .birthday-title{font-size:clamp(34px,10vw,58px)}
  .personal-message{margin-top:16px;font-size:clamp(14px,4vw,20px)}
  .hug-note{margin-top:12px;padding-top:10px;font-size:clamp(11px,3.2vw,16px)}
}


/* Wick-anchored flame visuals: same image coordinates at every screen size */
.wick-flame{position:absolute;z-index:10;width:1.95%;height:8.1%;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:none}
.wick-flame.f2{left:43.85%;top:25.0%}
.wick-flame.f1{left:57.52%;top:25.0%}
.wick-flame .fire{position:absolute;inset:0;border-radius:50% 50% 43% 57%/69% 69% 31% 31%;background:radial-gradient(ellipse at 50% 73%,#fff 0 13%,#fffbd0 14% 27%,#ffe26a 31%,#ffb126 47%,#ff7c17 64%,#f24a08 77%,rgba(255,70,0,.02) 89%);box-shadow:0 0 9px rgba(255,255,215,.95),0 0 22px rgba(255,181,53,.92),0 0 46px rgba(255,111,20,.72);animation:flicker .24s infinite alternate ease-in-out}
.wick-flame .fire:after{content:"";position:absolute;left:39%;bottom:0;width:23%;height:27%;border-radius:50%;background:#6384ff;filter:blur(1px)}
.wick-flame .wick-smoke{position:absolute;left:50%;bottom:0;width:10px;height:10px;border-radius:50%;background:rgba(220,216,208,.58);filter:blur(4px);opacity:0}
.wick-flame.out .fire{animation:die .55s ease-out forwards}
.wick-flame.out .wick-smoke{animation:smoke 2s .25s ease-out forwards}
.wick-flame.relighting .fire{animation:relight 3s ease-in-out forwards}
.candle .flame,.candle .smoke{display:none!important}

</style>
</head>
<body>
<div class="stage">
<img class="bg" src="cake-scene.png" alt="Chocolate birthday cake for Agu">
<div class="ambient"></div>
<div class="glow g2" id="g2"></div><div class="glow g1" id="g1"></div>
<div class="wick-flame f2" id="f2"><span class="fire"></span><span class="wick-smoke"></span></div><div class="wick-flame f1" id="f1"><span class="fire"></span><span class="wick-smoke"></span></div>
<button class="candle c2" data-flame="f2" data-glow="g2" aria-label="Blow out candle 2"><span class="flame"></span><span class="smoke"></span></button>
<button class="candle c1" data-flame="f1" data-glow="g1" aria-label="Blow out candle 1"><span class="flame"></span><span class="smoke"></span></button>
<div class="celebration-shade" id="shade"></div>
<div class="message" id="message">
  <div class="message-card">
    <div class="birthday-title">Happy Birthday Agu!</div>
    <div class="personal-message">I'm really happy that you're in my life Agu<br>Enjoy your birthday and keep being the best!</div>
    <div class="hug-note">I own you a happy birthday hug :)</div>
  </div>
</div>
</div>
<canvas id="fx"></canvas>
<script>
const candles=[...document.querySelectorAll('.candle')];
const message=document.getElementById('message');const shade=document.getElementById('shade');
let blown=0, locked=false;

candles.forEach(c=>c.addEventListener('click',e=>{
 e.stopPropagation();
 if(locked || c.classList.contains('out')) return;
 c.classList.add('out');
 document.getElementById(c.dataset.flame).classList.add('out');
 document.getElementById(c.dataset.glow).style.opacity='0';
 blown++;
 burst(e.clientX,e.clientY,44);
 if(blown===2){
   locked=true;
   setTimeout(()=>{
     message.classList.remove('fade');
     message.classList.add('show');shade.classList.add('show');
     celebrationBurst(innerWidth*.05,innerHeight*.58,190,1);
     celebrationBurst(innerWidth*.95,innerHeight*.58,190,-1);
     celebrationBurst(innerWidth*.24,innerHeight*.18,95,1);
     celebrationBurst(innerWidth*.76,innerHeight*.18,95,-1);
     burst(innerWidth*.50,innerHeight*.22,120);
     setTimeout(beginReset,10000);
   },800);
 }
}));

function beginReset(){
 message.classList.remove('show');
 message.classList.add('fade');shade.classList.remove('show');

 candles.forEach(c=>{
   c.classList.remove('out');
   c.classList.add('relighting');
   const flame=document.getElementById(c.dataset.flame);
   flame.classList.remove('out');
   flame.classList.add('relighting');
   const glow=document.getElementById(c.dataset.glow);
   glow.classList.add('relighting');
   glow.style.opacity='1';
 });

 setTimeout(()=>{
   candles.forEach(c=>{c.classList.remove('relighting');document.getElementById(c.dataset.flame).classList.remove('relighting')});
   document.querySelectorAll('.glow').forEach(g=>g.classList.remove('relighting'));
   message.classList.remove('fade');
   blown=0;
   locked=false;
 },3000);
}

/* click confetti + mouse magic dust */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let particles=[];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
resize();addEventListener('resize',resize);
function burst(x,y,n=30){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*7;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.12,life:50+Math.random()*40,size:2+Math.random()*5,hue:34+Math.random()*42})}}

function celebrationBurst(x,y,n,dir){
 const hues=[0,28,48,115,190,225,285,325];
 for(let i=0;i<n;i++){
   const angle=(-1.35 + Math.random()*1.25) * dir;
   const speed=5+Math.random()*10;
   particles.push({
     x,y,
     vx:Math.cos(angle)*speed*dir,
     vy:-4-Math.random()*10,
     g:.16,
     life:85+Math.random()*55,
     size:5+Math.random()*10,
     hue:hues[Math.floor(Math.random()*hues.length)]
   });
 }
}

addEventListener('click',e=>burst(e.clientX,e.clientY));
addEventListener('pointermove',e=>{if(e.pointerType==='mouse')for(let i=0;i<2;i++)particles.push({x:e.clientX+(Math.random()-.5)*9,y:e.clientY+(Math.random()-.5)*9,vx:(Math.random()-.5)*.7,vy:-.35-Math.random()*.8,g:.01,life:20+Math.random()*20,size:1+Math.random()*2.5,hue:38+Math.random()*16})});
(function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;ctx.globalAlpha=Math.min(1,p.life/18);ctx.fillStyle=`hsl(${p.hue} 100% 67%)`;ctx.shadowBlur=10;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(animate)})();
</script>
</body></html>
